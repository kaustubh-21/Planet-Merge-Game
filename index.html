<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Pandu - A cosmic merge game where planets collide and evolve">
  <meta name="theme-color" content="#1a0033">
  <title>Pandu - Cosmic Merge Game</title>
  <link rel="manifest" href="/manifest.json">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: linear-gradient(180deg, #0a0015 0%, #1a0033 50%, #0f001a 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Arial', sans-serif;
    }
    
    #gameCanvas {
      display: block;
      max-width: 100%;
      max-height: 100%;
      box-shadow: 0 0 50px rgba(139, 0, 255, 0.5);
      border: 2px solid #8B00FF;
    }
    
    #loading {
      position: absolute;
      color: white;
      font-size: 24px;
      text-align: center;
    }
    
    #loading.hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div id="loading">
    <h1>🌌 PANDU 🌌</h1>
    <p>Loading cosmic merge experience...</p>
  </div>
  <canvas id="gameCanvas" width="600" height="800"></canvas>
  <script type="module" src="/main.js"></script>
</body>
</html>
